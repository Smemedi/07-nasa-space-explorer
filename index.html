<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <div>
        <p class="eyebrow">Astronomy Picture of the Day</p>
        <h1>Space Explorer</h1>
      </div>
    </header>

    <main>
      <section class="fact-section" aria-labelledby="fact-heading">
        <div class="fact-mark" aria-hidden="true">i</div>
        <div>
          <h2 id="fact-heading">Did You Know?</h2>
          <p id="spaceFact"></p>
        </div>
      </section>

      <form id="dateForm" class="filters">
        <label>
          <span>Start date</span>
          <input type="date" id="startDate" required />
        </label>
        <label>
          <span>End date</span>
          <input type="date" id="endDate" required />
        </label>
        <button type="submit">Get Space Images</button>
      </form>

      <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>

      <section id="gallery" class="gallery" aria-label="Astronomy pictures">
        <div class="placeholder">
          <div class="placeholder-icon" aria-hidden="true">&#9733;</div>
          <p>Select a date range and click “Get Space Images” to explore the cosmos.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="apodModal" class="modal" aria-hidden="true" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalExplanation" tabindex="-1">
      <button id="closeModal" class="modal-close" type="button" aria-label="Close details">&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <div class="modal-details">
        <p id="modalDate" class="modal-date"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation"></p>
      </div>
    </section>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
